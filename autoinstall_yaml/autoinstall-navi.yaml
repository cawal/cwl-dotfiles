# Ubuntu autoinstall profile for navi.
#
# Current hardware from navi.txt:
# - Dell Inspiron 5584
# - Internal disk: ata-SanDisk_SDSSDA240G_171014463211, 240GB SATA SSD
# - External USB disk observed: TOSHIBA MQ04UBF100_331PP0W3T, not selected here
#
# WARNING: this profile wipes the internal SanDisk SSD and creates a fresh
# encrypted LUKS + LVM layout. Back up /home before using it.
autoinstall:
  version: 1

  locale: pt_BR.UTF-8
  keyboard:
    layout: br
    variant: ""
    toggle: null

  timezone: America/Sao_Paulo

  refresh-installer:
    update: true

  source:
    # For Ubuntu Desktop ISO. Use ubuntu-server for Ubuntu Server ISO.
    id: ubuntu-desktop
    search_drivers: true

  apt:
    mirror-selection:
      primary:
        - country-mirror
        - uri: http://archive.ubuntu.com/ubuntu
    fallback: offline-install
    geoip: true

  identity:
    realname: "Cawal"
    username: cawal
    hostname: navi
    # Replace in a local, non-versioned copy. Do not commit a real password hash.
    # mkpasswd --method=SHA-512 --rounds=4096
    password: "$6$REPLACE_WITH_HASHED_PASSWORD"

  ssh:
    install-server: true
    authorized-keys: []
    allow-pw: true

  codecs:
    install: true

  drivers:
    install: true

  oem:
    install: auto

  updates: all
  shutdown: reboot

  storage:
    swap:
      size: 0
    config:
      - id: disk0
        type: disk
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        grub_device: false
        match:
          serial: SanDisk_SDSSDA240G_171014463211

      - id: esp
        type: partition
        device: disk0
        size: 1G
        number: 1
        flag: boot
        grub_device: true
        wipe: superblock

      - id: boot-partition
        type: partition
        device: disk0
        size: 2G
        number: 2
        wipe: superblock

      - id: crypt-partition
        type: partition
        device: disk0
        size: -1
        number: 3
        wipe: superblock

      - id: esp-format
        type: format
        fstype: fat32
        volume: esp

      - id: boot-format
        type: format
        fstype: ext4
        volume: boot-partition

      - id: crypt0
        type: dm_crypt
        dm_name: crypt0
        volume: crypt-partition
        key: REPLACE_WITH_LUKS_PASSPHRASE

      - id: vg0
        type: lvm_volgroup
        name: vg0
        devices:
          - crypt0

      - id: lv-root
        type: lvm_partition
        name: root
        volgroup: vg0
        size: 50G
        wipe: superblock

      - id: lv-var
        type: lvm_partition
        name: var
        volgroup: vg0
        size: 45G
        wipe: superblock

      - id: lv-swap
        type: lvm_partition
        name: swap
        volgroup: vg0
        size: 10G
        wipe: superblock

      - id: lv-home
        type: lvm_partition
        name: home
        volgroup: vg0
        size: -1
        wipe: superblock

      - id: root-format
        type: format
        fstype: ext4
        volume: lv-root

      - id: var-format
        type: format
        fstype: ext4
        volume: lv-var

      - id: swap-format
        type: format
        fstype: swap
        volume: lv-swap

      - id: home-format
        type: format
        fstype: ext4
        volume: lv-home

      - id: root-mount
        type: mount
        device: root-format
        path: /

      - id: boot-mount
        type: mount
        device: boot-format
        path: /boot

      - id: esp-mount
        type: mount
        device: esp-format
        path: /boot/efi

      - id: var-mount
        type: mount
        device: var-format
        path: /var

      - id: home-mount
        type: mount
        device: home-format
        path: /home

  packages:
    - apt-transport-https
    - build-essential
    - ca-certificates
    - curl
    - docker.io
    - git
    - gnupg
    - lsb-release
    - make
    - neovim
    - openssh-server
    - stow
    - vim

  late-commands:
    - curtin in-target -- systemctl enable ssh
    - curtin in-target -- usermod -aG docker cawal

  error-commands:
    - tar -czf /installer-logs.tar.gz /var/log/installer/
    - journalctl -b > /installer-journal.log
